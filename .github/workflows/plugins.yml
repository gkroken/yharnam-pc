# SPDX-License-Identifier: GPL-3.0-or-later
# The plugins branch on Windows: build the port as build.sh does (MSYS2 CLANG64), then run the
# plugin host's own tests. None needs the game: the tests use fake hosts and test plugins.
#
# A failing step also writes its log's tail as an error annotation, which the public check-runs
# API serves without signing in (job logs need a token):
#   https://api.github.com/repos/<owner>/<repo>/check-runs/<id>/annotations
name: plugins

on:
  push:
    branches: [plugins]
  pull_request:
    branches: [plugins]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # The runner's git turns LF into CRLF on checkout: bash then fails on build.sh's \r, and
      # the FSR-Vulkan patches stop applying.
      - name: Check out as LF
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # release: false uses the runner's own C:\msys64, where msys2-env.sh looks for it.
      # The packages are packaging/windows/README.md's list.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf mingw-w64-clang-x86_64-openssl mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc mingw-w64-clang-x86_64-nlohmann-json

      - name: Build the port (bash build.sh)
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory '*'
          annotate() {  # <title> <log>: the log's last 40 lines as one error annotation
            local text; text=$(tail -40 "$2" | sed -e 's/%/%25/g' -e 's/\r//g')
            echo "::error title=$1::${text//$'\n'/%0A}"
          }
          if ! bash build.sh > out-build.log 2>&1; then
            cat out-build.log
            [[ -f out/gpu-build.log ]] && annotate 'build.sh failed' out/gpu-build.log || annotate 'build.sh failed' out-build.log
            exit 1
          fi
          cat out-build.log
          test -f out/bb-probe.exe

      # The tests of what this branch adds or hooks. EXCLUDE_FROM_ALL targets: built one by one.
      - name: Plugin host tests (C)
        shell: msys2 {0}
        run: |
          annotate() {
            local text; text=$(tail -40 "$2" | sed -e 's/%/%25/g' -e 's/\r//g')
            echo "::error title=$1::${text//$'\n'/%0A}"
          }
          mkdir -p out/ci
          failed=0
          for t in plugin-host-test flag-delivery-test game-state-test params-test text-test \
                   input-take-test engine-hooks-test input-bindings-test; do
            if ! ninja -C out/gpu "$t" > "out/ci/build-$t.log" 2>&1; then
              echo "BUILD FAILED $t"; annotate "$t did not build" "out/ci/build-$t.log"; failed=1; continue
            fi
            if timeout 300 "out/gpu/$t.exe" > "out/ci/run-$t.log" 2>&1; then
              echo "PASS $t: $(tail -1 "out/ci/run-$t.log")"
            else
              echo "FAIL $t"; cat "out/ci/run-$t.log"; annotate "$t failed" "out/ci/run-$t.log"; failed=1
            fi
          done
          exit $failed

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The launcher's plugins page and the param-name reader; standard library only. The
      # paramdefs tests that read the game's files skip without BB_TEST_GAME_DIR.
      - name: Launcher and paramdefs tests (Python)
        shell: bash
        working-directory: tests
        run: |
          mkdir -p ../out/ci
          if ! python -m unittest -v test_launcher_plugins test_paramdefs > ../out/ci/python.log 2>&1; then
            cat ../out/ci/python.log
            text=$(tail -40 ../out/ci/python.log | sed -e 's/%/%25/g' -e 's/\r//g')
            echo "::error title=Python tests failed::${text//$'\n'/%0A}"
            exit 1
          fi
          cat ../out/ci/python.log
